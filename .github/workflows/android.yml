# FoodGaon - builds the Android app and the web version automatically on every push
# install.apk  = install directly on a phone (testing)
# release.apk / release.aab = signed with the FoodGaon release key (from repo secrets) for Indus Appstore / Play Store
name: Build FoodGaon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Build web app
        run: npx vite build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/foodgaon-release.jks"
      - name: Build APK and AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/foodgaon-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FoodGaon-v1.0.${{ github.run_number }}-install.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FoodGaon.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/FoodGaon-v1.0.${{ github.run_number }}-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/FoodGaon-v1.0.${{ github.run_number }}-release.aab
          cp android/app/build/outputs/mapping/release/mapping.txt out/FoodGaon-v1.0.${{ github.run_number }}-mapping.txt
          ls -la out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FoodGaon v1.0.${{ github.run_number }}
          files: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

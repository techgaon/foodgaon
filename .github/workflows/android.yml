# FoodGaon — builds the Android app and the web version automatically on every push
# install.apk  = install directly on a phone (testing)
# unsigned.aab = for Play Store; sign with the upload key before uploading (key is NOT kept on GitHub)
name: Build FoodGaon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Build web app
        run: npx vite build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK and AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FoodGaon-v1.0.${{ github.run_number }}-install.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FoodGaon.apk
          cp android/app/build/outputs/bundle/release/*.aab out/FoodGaon-v1.0.${{ github.run_number }}-unsigned.aab
          ls -la out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FoodGaon v1.0.${{ github.run_number }}
          files: out/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

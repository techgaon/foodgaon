# Applies change bundles uploaded from the browser (incoming/*.patch.gz), then starts the app build.
# Workflow files cannot be changed by this job, so they are skipped here and added from the browser.
name: Apply incoming update
on:
  push:
    branches: [main]
    paths: ['incoming/**']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -e
          git config user.name "TechGaon"
          git config user.email "contact@techgaon.in"
          for f in $(ls incoming/*.patch.gz | sort); do
            gunzip -c "$f" > /tmp/u.patch
            git apply --whitespace=nowarn --exclude='.github/workflows/*' /tmp/u.patch
          done
          git rm -rq incoming
          git add -A
          git commit -m "FoodGaon update: restaurant onboarding, agreement, quality checks, COD rules, online payment, share and join info"
          git push
      - name: Start app build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main

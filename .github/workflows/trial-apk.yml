name: Build trial APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/trial-apk.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Verify app behavior
        run: |
          node tests/foodgaon.cjs
          node tests/trial-login.cjs
          node tests/login-flow.cjs
          node tests/celebrations.cjs
          node tests/application-delete.cjs
          node tests/restaurant-pin.cjs
      - name: Build and sync app
        run: |
          npx vite build
          npx cap sync android
      - name: Build installable trial APK
        working-directory: android
        env:
          VERSION_CODE: '10'
          VERSION_NAME: 1.0.10-trial
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK signature and collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FoodGaon-v1.0.10-trial.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs out/FoodGaon-v1.0.10-trial.apk
          "$TOOLS/aapt" dump badging out/FoodGaon-v1.0.10-trial.apk | head -5
          sha256sum out/FoodGaon-v1.0.10-trial.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FoodGaon-v1.0.10-trial
          path: out/
          retention-days: 14
